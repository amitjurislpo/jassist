<section class="contact first" id="contact" aria-labelledby="cn-h">
  <div class="wrap contact-in">
    <div class="rv">
      <span class="kicker"><b>Contact</b> Get started</span>
      <h1 class="h2" id="cn-h">Let's Build <span class="gg-d">Your Team.</span></h1>
      <p class="lead">Reach out by email or phone. Tell us what you need and we'll come back with a recommended team structure for your business.</p>
    </div>
    <div class="c-cards rv d1">
      <a class="cc" href="mailto:{{email}}">
        <span class="ci2"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        <h2>Email Us</h2>
        <p>For general inquiries &amp; support</p>
        <b>{{email}}</b>
      </a>
      <a class="cc" href="{{phonehref}}">
        <span class="ci2"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg></span>
        <h2>Call Us</h2>
        <p>Mon–Fri • 9 AM – 6 PM</p>
        <b>{{phone}}</b>
      </a>
    </div>
  </div>
</section>

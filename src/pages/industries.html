<!-- ============ INDUSTRIES ============ -->
<section class="ind first" id="industries" aria-labelledby="in-h">
  <div class="wrap ind-top">
    <div class="rv">
      <span class="kicker"><b>Industries</b> Drag to explore</span>
      <h1 class="h2" id="in-h">Virtual Assistants for Businesses That Need <span class="gg-d">More Done.</span></h1>
    </div>
    <div class="arrows rv d1">
      <button id="prev" aria-label="Previous industries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button id="next" aria-label="Next industries">{{arrow}}</button>
    </div>
  </div>
  <div class="car rv d2" id="car"></div>
  <div class="car-prog"><div><i id="carProg"></i></div></div>
</section>

<!-- ============ CTA ============ -->
<section class="cta" aria-labelledby="ct-h">
  <div class="wrap">
    <div class="cta-border rv">
      <div class="cta-in">
        <span class="pill"><b>START</b> Let's talk</span>
        <h2 class="h2" id="ct-h">Ready to Build Your <span class="gg">Remote Team?</span></h2>
        <p>Tell us what you need. We'll help you find the right people to get it done.</p>
        <div class="hero-ctas">
          <a href="/contact" class="btn btn-gold">Get Started {{arrow}}</a>
          <a href="/contact" class="btn btn-ghost-w">Talk to Our Team</a>
        </div>
      </div>
    </div>
  </div>
</section>
